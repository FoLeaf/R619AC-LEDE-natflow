name: Build R619AC (LEDE + natflow)

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '编译完成后创建 Release'
        type: boolean
        required: false
        default: true
      ssh_debug:
        description: '编译前开一个 tmate SSH 会话用于调试'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'files/**'
      - '.github/workflows/build-r619ac.yml'

env:
  # Lean 的 LEDE：ipq40xx 仍是内核 5.10 + essedma/ar40xx(swconfig)，性能远好于上游 DSA
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/r619ac-lede.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    # LEDE 的内核 5.10 在过新的 host gcc 上编译 host 工具容易翻车，固定用 22.04。
    # 若 GitHub 下线了 22.04，改成 ubuntu-24.04 再试。
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -hT

      - name: 安装编译依赖
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
            wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo timedatectl set-timezone "$TZ"

      - name: 拉取 LEDE 源码
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt && echo "SRC_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: 执行 diy-part1（集成 natflow）
        run: |
          chmod +x "$DIY_P1_SH"
          cd openwrt && "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 载入配置并执行 diy-part2
        run: |
          chmod +x "$DIY_P2_SH"
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt && "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: 展开 .config
        run: |
          cd openwrt
          make defconfig
          echo "===== 机型与 natflow ====="
          grep -E '^CONFIG_TARGET_ipq40xx|natflow' .config || true
          echo "===== 确认是 essedma 而不是 DSA 驱动 ====="
          grep -E 'ESSEDMA|AR40XX|SWCONFIG' target/linux/ipq40xx/config-5.10 || \
            echo "!!! 警告：没找到 essedma，底包可能已切到 DSA 驱动"

      - name: SSH 调试（可选）
        uses: mxschmitt/action-tmate@v3
        if: inputs.ssh_debug
        timeout-minutes: 60

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "使用 $(nproc) 线程编译"
          make -j"$(nproc)" || make -j1 V=s
          echo "DEVICE_NAME=p2w_r619ac-128m" >> "$GITHUB_ENV"
          echo "FILE_DATE=$(date +"%Y%m%d-%H%M")" >> "$GITHUB_ENV"

      - name: 整理产物
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          ls -lh
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: R619AC-LEDE-natflow-${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 创建 Release
        if: github.event_name != 'workflow_dispatch' || inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: R619AC-${{ env.FILE_DATE }}
          name: R619AC LEDE+natflow ${{ env.FILE_DATE }}
          files: ${{ env.FIRMWARE }}/*
          body: |
            竞斗云 2.0 / P&W R619AC —— Lean LEDE + natflow

            - 底包：`coolsnowwolf/lede` @ `${{ env.SRC_COMMIT }}`（内核 5.10，essedma + ar40xx swconfig 驱动）
            - 加速：`kmod-natflow`（fw3 的 flow offloading 已默认关闭，避免冲突）
            - 机型：P&W R619AC **128M NAND**，需要 opboot ≥ 1.0.9
            - 默认地址 `192.168.1.1`，用户 `root`，密码 `password`（LEDE 默认）
            - 无线默认关闭，可在 LuCI 中开启

            **刷机必须不保留配置**：essedma(swconfig) 与 DSA 的网络配置不兼容。
            从 opboot web 刷 `-nand-factory.ubi`；已在本固件上则用 `-sysupgrade.bin`。
